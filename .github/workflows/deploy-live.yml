name: Deploy Backend Live

on:
  push:
    branches:
      - live
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Hostinger Live
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftp.demohandler.in
          username: u479097380
          password: DemoHandler_1
          port: 21
          protocol: ftp
          security: loose
          local-dir: ./
          server-dir: /domains/demohandler.in/public_html/apisafarsystem/
          dangerous-clean-slate: false
          exclude: |
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.env
            **/images/**
            **/public/images/**
            **/storage/*.key
            **/storage/framework/cache/data/*
            **/storage/framework/sessions/*
            **/storage/framework/views/*
            **/storage/logs/*.log
            **/bootstrap/cache/*.php
            **/vendor/**

      - name: Send Success Email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Deployment Successful - CRM Safar System (Live)
          to: ashwanipandeytech@gmail.com, pushpendradwivedi9@gmail.com, rohitsingh28dec@gmail.com
          from: CRM CI/CD <${{ secrets.MAIL_USERNAME }}>
          body: |
            Deployment of CRM Safar System to production live was successful.
            
            Commit: ${{ github.sha }}
            Workflow: ${{ github.workflow }}
            Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Send Failure Email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Deployment Failed - CRM Safar System (Live)
          to: ashwanipandeytech@gmail.com, pushpendradwivedi9@gmail.com, rohitsingh28dec@gmail.com
          from: CRM CI/CD <${{ secrets.MAIL_USERNAME }}>
          body: |
            Deployment of CRM Safar System to production live failed. 
            
            Commit: ${{ github.sha }}
            Workflow: ${{ github.workflow }}
            Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            Please check the GitHub Actions logs for more details
